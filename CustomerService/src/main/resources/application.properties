#logging.level.org.apache.kafka=DEBUG
#logging.level.org.springframework.kafka=DEBUG
spring.application.name=AccountManagerService
server.port=8091
management.endpoints.web.exposure.include=prometheus,metrics,health
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
#server.port=8097

#redis connection
spring.redis.host=192.168.56.5
#127.0.0.1
spring.redis.port=6379
spring.redis.password=strongpassword
spring.redis.database=0
logging.level.org.springframework.data.redis=DEBUG
logging.level.redis.clients.jedis=DEBUG
##default connecting pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
#PostgreSql
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/microservices
spring.datasource.username=kong
spring.datasource.password=postgres
spring.datasource.hikari.read-only=false
#spring.datasource.hikari.schema=service
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.connection.readOnly=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.open-in-view=false
server.error.include-message=always
logging.level.=TRACE
log4j.logger.kafka=DEBUG
#Kafka consumer setting
#spring.kafka.bootstrap-servers=192.168.250.16:9093,192.168.250.16:9096,192.168.250.16:9098
spring.kafka.bootstrap-servers=192.168.56.5:9092,192.168.56.5:9095,192.168.56.5:9097
spring.kafka.consumer.group-id=processing-group
#spring.kafka.consumer.topic=transaction-request
spring.kafka.consumer.properties.telemetry.enabled=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=com.javaservice.MyService.Consumer.ConsumerDeserializer
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.max-poll-interval=300000
spring.kafka.consumer.max-poll-records=200
spring.kafka.consumer.socket-timeout=60000
#com.javaservice.MyService.Consumer
#org.springframework.kafka.support.serializer.JsonDeserializer
#spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.value.deserializer.target-type=com.javaservice.MyService.Entity.Transaction
spring.kafka.listener.retry.enabled=true
spring.kafka.listener.retry.max-attempts=3
#DLQ
spring.kafka.producer.value-serializer=com.javaservice.MyService.Consumer.ConsumerSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

